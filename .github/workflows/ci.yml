name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: npm ci
      - run: npm test
