name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the CPU binaries
        run: cargo build --release --locked -p infer-cli -p infer-serve
      - name: pack the archive
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/knolo-infer-stage"
          mkdir -p "${stage}"
          cp target/release/knolo-infer target/release/knolo-infer-worker "${stage}/"
          tar -C "${stage}" -czf knolo-infer-linux-x86_64.tar.gz knolo-infer knolo-infer-worker
          (
            cd "${stage}"
            sha256sum knolo-infer knolo-infer-worker
          ) > SHA256SUMS
          sha256sum knolo-infer-linux-x86_64.tar.gz >> SHA256SUMS
      - name: upload the CPU release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            knolo-infer-linux-x86_64.tar.gz \
            SHA256SUMS \
            --clobber
